# Integración continua: tests de Python, build de la interfaz web y build
# de la imagen Docker para amd64 y arm64 (sin publicarla).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests de Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Misma imagen de desarrollo que en local, con ffmpeg y libsndfile.
      - name: Construir la imagen de desarrollo
        run: docker build -f docker/dev.Dockerfile -t fmh-dev .

      - name: Ejecutar pytest
        run: docker run --rm -v "$PWD":/app fmh-dev pytest --color=no

  frontend:
    name: Build de la interfaz web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # Incluye la comprobación de tipos con tsc
      - run: npm run build

  docker:
    name: Imagen Docker (amd64 y arm64)
    runs-on: ubuntu-latest
    needs: [tests, frontend]
    steps:
      - uses: actions/checkout@v5

      # QEMU emula arm64 en el runner amd64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
